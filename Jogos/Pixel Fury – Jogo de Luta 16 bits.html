<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pixel Fury – Jogo de Luta 16 bits</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ecf7;--fg:#1d1330;--card:#fff;--mut:#5b4d78;--ac:#d6336c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10081f;--fg:#f3eaff;--card:#1b0f33;--mut:#a996cf;--ac:#ff5c9a}}
:root[data-theme="dark"]{--bg:#10081f;--fg:#f3eaff;--card:#1b0f33;--mut:#a996cf;--ac:#ff5c9a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace;display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px;min-height:100vh}
h1{font-size:clamp(14px,3vw,22px);margin:6px 0 0;color:var(--ac);text-align:center;letter-spacing:1px}
.wrap{position:relative;width:100%;max-width:960px;border:6px solid var(--fg);border-radius:10px;box-shadow:0 0 0 4px var(--ac),0 10px 30px #0006;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;aspect-ratio:16/9}
.crt{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,#0000 0 2px,#0003 2px 3px),radial-gradient(ellipse at center,#0000 60%,#0006 100%)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;width:100%;max-width:960px}
.card{background:var(--card);border:3px solid var(--fg);border-radius:8px;padding:12px;font-size:9px;line-height:1.9;color:var(--mut)}
.card b{color:var(--fg);display:block;margin-bottom:4px;font-size:10px}
</style>
</head>
<body>
<h1>PIXEL FURY</h1>
<div class="wrap"><canvas id="c" tabindex="0"></canvas><div class="crt"></div></div>
<div class="keys">
<div class="card"><b>JOGADOR 1</b>A / D mover · W pular · S defender<br>F soco · G chute · H especial (barra 50%)</div>
<div class="card"><b>JOGADOR 2</b>← / → mover · ↑ pular · ↓ defender<br>K soco · L chute · ; especial (barra 50%)</div>
</div>
<script>
const W=384,H=216,GY=188,cv=document.getElementById('c'),ctx=cv.getContext('2d');
cv.width=W;cv.height=H;ctx.imageSmoothingEnabled=false;
let keys={},pressed={};
addEventListener('keydown',e=>{if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault();if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1});
addEventListener('keyup',e=>keys[e.code]=0);
let ac;function sfx(f,d,t='square',v=.07,fe=f){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=t;o.frequency.setValueAtTime(f,n);o.frequency.linearRampToValueAtTime(fe,n+d);g.gain.setValueAtTime(v,n);g.gain.linearRampToValueAtTime(0,n+d);o.connect(g).connect(ac.destination);o.start();o.stop(n+d)}catch(e){}}

/* ---------- Cenário ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const g=bg.getContext('2d');
['#1a0b3b','#2d1060','#4a1a7a','#7a2a8a','#b03a8a','#e0527a','#ff7b6b','#ffa86b','#ffd08a','#ffd08a','#ffd08a','#ffd08a'].forEach((c,i)=>{g.fillStyle=c;g.fillRect(0,i*17,W,18)});
for(let i=0;i<40;i++){g.fillStyle='#fff';g.fillRect((Math.sin(i*91.7)*.5+.5)*W|0,(Math.sin(i*33.3)*.5+.5)*70|0,1,1)}
g.fillStyle='#fff3b0';for(let y=-26;y<=26;y++){if(y>2&&y%5===0)continue;const w=Math.sqrt(676-y*y)|0;g.fillRect(272-w,108+y,2*w,1)}
for(let x=0;x<W;x+=2){let t=GY-52-(Math.sin(x*.025)*16+Math.sin(x*.09)*5+28);g.fillStyle='#3d1a5e';g.fillRect(x,t,2,GY-t);t=GY-20-(Math.sin(x*.03+2)*10+Math.sin(x*.11)*4+14);g.fillStyle='#24103f';g.fillRect(x,t,2,GY-t)}
for(let k=0;k<4;k++){const w=64-k*12,y=GY-18-k*16;g.fillStyle='#14082a';g.fillRect(70-w/2,y,w,4);g.fillStyle='#1c0c38';g.fillRect(70-w/2+8,y+4,w-16,12)}
for(let y=GY,r=0;y<H;y+=6,r++){g.fillStyle=r%2?'#6b3f1d':'#7a4a24';g.fillRect(0,y,W,6);g.fillStyle='#4b2a12';g.fillRect(0,y+5,W,1);for(let x=(r%2)*24;x<W;x+=48)g.fillRect(x,y,1,6)}
g.fillStyle='#d99a55';g.fillRect(0,GY,W,2);
})();

/* ---------- Lutadores ---------- */
const PAL=[{n:'KAITO',gi:'#f2f2f2',gi2:'#c9c9d6',band:'#e0242b',belt:'#222',pants:'#e8e8f0',skin:'#e8a46a',hair:'#2a1608',fx:'#ff6a00'},
 {n:'RENKA',gi:'#2b5fd9',gi2:'#1d3f94',band:'#ffd23a',belt:'#ffd23a',pants:'#1d3f94',skin:'#c98856',hair:'#d33a8a',fx:'#38e1ff'}];
const C1={l:'KeyA',r:'KeyD',u:'KeyW',d:'KeyS',p:'KeyF',k:'KeyG',s:'KeyH'},C2={l:'ArrowLeft',r:'ArrowRight',u:'ArrowUp',d:'ArrowDown',p:'KeyK',k:'KeyL',s:'Semicolon'};
const ATK={punch:{su:3,ac:4,rc:9,dmg:6,rg:26,h:-32},kick:{su:6,ac:5,rc:13,dmg:10,rg:32,h:-14},jkick:{su:0,ac:999,rc:0,dmg:8,rg:26,h:-20}};
const mk=(x,pal,face,ctl,ai)=>({x,y:GY,vx:0,vy:0,face,hp:100,hpd:100,mp:0,st:'idle',t:0,pal,ctl,ai,hit:false,ai_t:0,mode:.5});
let a,b,fireballs=[],sparks=[],G={s:'menu',cpu:true,w:[0,0],round:0,timer:0,clock:0,shake:0,tick:0};
a=mk(110,PAL[0],1,C1,false);b=mk(274,PAL[1],-1,C2,true);
function newRound(){const wa=G.w;a=mk(110,PAL[0],1,C1,false);b=mk(274,PAL[1],-1,C2,G.cpu);fireballs=[];sparks=[];G.round++;G.s='intro';G.timer=130;G.clock=99*60;sfx(300,.3,'square',.07,600)}
function start(cpu){G.cpu=cpu;G.w=[0,0];G.round=0;newRound()}
const go=(f,s)=>{f.st=s;f.t=0;f.hit=false;sfx(s==='kick'?200:260,.07,'square',.05,120)};
const spark=(x,y,c)=>sparks.push({x,y,t:0,c});

function hurt(o,att,dmg,dir){
 if(o.st==='ko')return;
 const blocked=o.st==='block'&&o.y>=GY&&o.face===-dir;
 if(blocked){o.hp-=Math.ceil(dmg*.2);o.vx=dir*1.4;sfx(130,.08,'square',.09);spark(o.x+o.face*10,o.y-30,'#8cf')}
 else{o.hp-=dmg;o.st='hit';o.t=0;o.vx=dir*2.6;if(o.y<GY)o.vy=-3;sfx(160,.14,'sawtooth',.12,50);spark(o.x+o.face*8,o.y-28,'#fff');G.shake=6;att.mp=Math.min(100,att.mp+dmg*2.5);o.mp=Math.min(100,o.mp+dmg)}
 if(o.hp<=0){o.hp=0;o.st='ko';o.t=0;o.vy=-5;o.vx=dir*3;G.shake=14;sfx(120,.5,'sawtooth',.14,30)}
}
function aiInp(f,o){
 const i={l:0,r:0,u:0,d:0,p:0,k:0,s:0},dx=o.x-f.x,d=Math.abs(dx),fw=dx>0?'r':'l',bk=dx>0?'l':'r';
 if(--f.ai_t<=0){f.ai_t=8+Math.random()*18|0;f.mode=Math.random()}
 const fb=fireballs.find(q=>q.own!==f&&Math.abs(q.x-f.x)<70&&Math.sign(q.vx)===Math.sign(f.x-q.x));
 if(fb){if(Math.random()<.06)i.u=1;else if(f.mode<.5)i.d=1}
 else if((ATK[o.st]||o.st==='special')&&d<45&&f.mode<.55)i.d=1;
 else if(d>110&&f.mp>=50&&f.mode<.4)i.s=1;
 else if(d>48)i[fw]=1;
 else if(d>30){if(f.mode<.5)i[fw]=1;else if(Math.random()<.1)i.k=1}
 else{if(Math.random()<.14)(f.mode<.55?i.p=1:i.k=1);else if(f.mode>.85)i[bk]=1}
 return i;
}
function upd(f,o,i){
 f.t++;const air=f.y<GY;
 if(f.hpd>f.hp)f.hpd-=.4;
 if(!['ko','hit','special'].includes(f.st)&&!air&&!ATK[f.st])f.face=o.x>=f.x?1:-1;
 if(['idle','walk','block'].includes(f.st)){
  const dir=(i.r?1:0)-(i.l?1:0);
  if(i.d){f.st='block';f.vx=0}
  else if(i.u){f.st='jump';f.t=0;f.vy=-8.2;f.vx=dir*1.8}
  else if(i.p)go(f,'punch');else if(i.k)go(f,'kick');
  else if(i.s&&f.mp>=50){f.mp-=50;go(f,'special')}
  else{f.vx=dir*1.6;const n=dir?'walk':'idle';if(f.st!==n){f.st=n;f.t=0}}
 }else if(f.st==='jump'&&i.k)go(f,'jkick');
 const at=ATK[f.st];
 if(at){
  if(!f.hit&&f.t>at.su&&f.t<=at.su+at.ac&&o.st!=='ko'){
   const x1=Math.min(f.x,f.x+f.face*at.rg),x2=Math.max(f.x,f.x+f.face*at.rg);
   if(x2>o.x-9&&x1<o.x+9&&Math.abs((f.y+at.h)-(o.y-24))<27){f.hit=true;hurt(o,f,at.dmg,f.face)}}
  if(f.st!=='jkick'&&f.t>at.su+at.ac+at.rc){f.st='idle';f.t=0}
 }
 if(f.st==='special'){if(f.t===12){fireballs.push({x:f.x+f.face*24,y:f.y-30,vx:f.face*3.4,own:f,life:140});sfx(400,.25,'square',.08,900)}if(f.t>34){f.st='idle';f.t=0}}
 if(f.st==='hit'&&f.t>14){f.st='idle';f.t=0}
 f.vy+=.45;f.y+=f.vy;
 if(f.y>=GY){f.y=GY;f.vy=0;if(f.st==='jump'||f.st==='jkick'){f.st='idle';f.t=0;f.vx=0}if(!['walk','idle'].includes(f.st))f.vx*=.85}
 f.x=Math.max(14,Math.min(W-14,f.x+f.vx));
}
function inputOf(f,o){
 if(f.ai)return aiInp(f,o);const c=f.ctl;
 return{l:keys[c.l],r:keys[c.r],u:keys[c.u],d:keys[c.d],p:pressed[c.p],k:pressed[c.k],s:pressed[c.s]};
}
const NO={};
function step(){
 G.tick++;
 if(G.s==='menu'){if(pressed.Digit1||pressed.Numpad1)start(true);if(pressed.Digit2||pressed.Numpad2)start(false);return}
 const live=G.s==='fight';
 upd(a,b,live?inputOf(a,b):NO);upd(b,a,live?inputOf(b,a):NO);
 const dx=b.x-a.x,ov=18-Math.abs(dx);
 if(ov>0&&a.y>=GY&&b.y>=GY){const s=dx>=0?1:-1;a.x-=s*ov/2;b.x+=s*ov/2;a.x=Math.max(14,Math.min(W-14,a.x));b.x=Math.max(14,Math.min(W-14,b.x))}
 for(const q of fireballs){q.x+=q.vx;q.life--;const t=q.own===a?b:a;
  if(t.st!=='ko'&&Math.abs(q.x-t.x)<12&&Math.abs(q.y-(t.y-24))<26){hurt(t,q.own,12,Math.sign(q.vx));q.life=0}}
 fireballs=fireballs.filter(q=>q.life>0&&q.x>-10&&q.x<W+10);
 sparks.forEach(s=>s.t++);sparks=sparks.filter(s=>s.t<9);
 if(G.shake>0)G.shake--;
 if(G.s==='intro'&&--G.timer<=0)G.s='fight';
 else if(G.s==='fight'){
  G.clock--;
  if(a.hp<=0||b.hp<=0||G.clock<=0){
   const wi=a.hp>b.hp?0:b.hp>a.hp?1:-1;if(wi>=0)G.w[wi]++;G.win=wi;G.s='end';G.timer=170;
  }
 }else if(G.s==='end'&&--G.timer<=0){if(G.w[0]>=2||G.w[1]>=2)G.s='match';else newRound()}
 else if(G.s==='match'&&pressed.Enter)G.s='menu';
}

/* ---------- Desenho ---------- */
const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function txt(s,x,y,c='#fff',sz=8,al='left'){ctx.font=`${sz}px "Press Start 2P",monospace`;ctx.textAlign=al;ctx.fillStyle='#000';ctx.fillText(s,x+1,y+1);ctx.fillStyle=c;ctx.fillText(s,x,y)}
function drawF(f){
 const p=f.pal,s=f.st,t=f.t,air=f.y<GY;
 R(Math.round(f.x)-12,GY+1,24,3,'#0005');
 ctx.save();ctx.translate(Math.round(f.x),Math.round(f.y));ctx.scale(f.face,1);
 if(s==='ko'&&!air){R(-26,-9,34,9,p.gi);R(-26,-6,34,2,p.belt);R(-36,-12,11,11,p.skin);R(-38,-14,12,5,p.hair);R(8,-6,18,6,p.pants);ctx.restore();return}
 const bob=s==='idle'?(Math.floor(t/14)%2):0,wk=s==='walk'?Math.floor(t/6)%2:0,oy=(air?-6:0)-bob;
 const a_=ATK[s],atkOn=a_&&t>a_.su&&t<=a_.su+a_.ac+3;
 const hurtP=s==='hit'||(s==='ko'&&air);if(hurtP)ctx.translate(-3,0);
 // pernas
 if(air){R(-7,-14,6,11,p.pants);R(1,-14,7,9,p.pants);R(1,-6,8,4,p.skin)}
 else{R(-7+(wk?2:-2),-16,6,16,p.pants);R(-8+(wk?2:-2),-3,8,3,p.skin);
  if(s==='kick'&&atkOn){R(2,-20,28,6,p.pants);R(28,-21,7,8,p.skin);R(-7,-16,6,16,p.pants)}
  else{R(1+(wk?-2:2),-16,7,16,p.pants);R(1+(wk?-2:2),-3,9,3,p.skin)}}
 if(s==='jkick'){R(2,-16,26,6,p.pants);R(26,-17,7,8,p.skin)}
 // tronco
 R(-8,-34+oy,16,18,p.gi);R(-8,-34+oy,3,18,p.gi2);R(-8,-20+oy,16,3,p.belt);
 // cabeça
 R(-5,-46+oy,10,11,p.skin);R(-6,-49+oy,12,5,p.hair);R(-6,-45+oy,12,2,p.band);R(-9,-45+oy,4,2,p.band);
 if(hurtP||s==='ko'){R(1,-42+oy,4,1,'#111');R(1,-38+oy,3,2,'#611')}else R(2,-42+oy,2,2,'#111');
 // braços
 R(-10,-32+oy,5,10,p.gi2);R(-10,-23+oy,4,4,p.skin);
 if(s==='punch'&&atkOn){R(5,-32+oy,24,6,p.gi);R(28,-33+oy,7,8,p.skin)}
 else if(s==='block'){R(3,-45,7,18,p.gi);R(4,-48,6,5,p.skin)}
 else if(s==='special'){R(5,-34+oy,16,6,p.gi);R(20,-35+oy,6,8,p.skin);if(t>8){R(24,-40+oy,10,18,p.fx);R(28,-36+oy,6,10,'#fff')}}
 else if(hurtP){R(-2,-30+oy,5,10,p.gi)}
 else{R(5,-33+oy,6,9,p.gi);R(9,-31+oy,6,6,p.skin)}
 ctx.restore();
}
function bar(x,w,f,right){
 R(x-2,10,w+4,12,'#000');R(x,12,w,8,'#400');
 const wd=Math.round(w*f.hpd/100),wh=Math.round(w*f.hp/100);
 R(right?x+w-wd:x,12,wd,8,'#d33');
 R(right?x+w-wh:x,12,wh,8,f.hp>50?'#4ade4a':f.hp>25?'#ffd23a':'#ff5030');
 R(right?x+w-wh:x,12,wh,2,'#fff6');
 // medidor
 R(x,24,w,4,'#112');R(x,24,Math.round(w*f.mp/100),4,f.mp>=50?(G.tick%20<10?'#fff':'#38e1ff'):'#2a6aa0');
}
function render(){
 ctx.save();
 if(G.shake>0)ctx.translate((Math.random()-.5)*G.shake/2|0,(Math.random()-.5)*G.shake/2|0);
 ctx.drawImage(bg,0,0);
 if(G.s==='menu'){
  drawF(a);drawF(b);
  txt('PIXEL FURY',W/2,70,'#ffd23a',22,'center');txt('PIXEL FURY',W/2,68,'#ff5c9a',22,'center');
  txt('1  UM JOGADOR (VS CPU)',W/2,120,'#fff',9,'center');txt('2  DOIS JOGADORES',W/2,138,'#fff',9,'center');
  if(G.tick%60<38)txt('APERTE 1 OU 2',W/2,164,'#38e1ff',8,'center');
 }else{
  drawF(a.y<b.y?b:a);drawF(a.y<b.y?a:b);
  for(const q of fireballs){const c=q.own.pal.fx,d=-Math.sign(q.vx);
   R(q.x+d*14-6,q.y-2,12,4,c+'88');R(q.x+d*7-6,q.y-3,12,6,c);R(q.x-7,q.y-5,14,10,c);R(q.x-4,q.y-3,8,6,'#ffe9a0');R(q.x-2,q.y-1,4,3,'#fff')}
  for(const s of sparks){const r=3+s.t;R(s.x-r,s.y-1,r*2,2,s.c);R(s.x-1,s.y-r,2,r*2,s.c);R(s.x-r/2,s.y-r/2,2,2,'#fff')}
  bar(14,150,a,false);bar(220,150,b,true);
  R(176,8,32,18,'#000');txt(String(Math.max(0,Math.ceil(G.clock/60))).padStart(2,'0'),192,22,'#ffd23a',12,'center');
  txt(a.pal.n,14,42,'#fff',7);txt(G.cpu?'CPU':b.pal.n,370,42,'#fff',7,'right');
  for(let k=0;k<2;k++){R(16+k*10,46,8,8,G.w[0]>k?'#ffd23a':'#000a');R(360-k*10,46,8,8,G.w[1]>k?'#ffd23a':'#000a')}
  if(G.s==='intro'){txt('ROUND '+G.round,W/2,92,'#fff',14,'center');if(G.timer<60)txt('LUTAR!',W/2,116,'#ff5c9a',14,'center')}
  if(G.s==='end')txt(G.win<0?'EMPATE':(G.win===1&&G.cpu?'CPU':PAL[G.win].n)+' VENCEU',W/2,100,'#ffd23a',12,'center');
  if(G.s==='match'){R(0,70,W,70,'#000b');txt((G.w[0]>G.w[1]?a.pal.n:(G.cpu?'CPU':b.pal.n))+' E O CAMPEAO!',W/2,100,'#ffd23a',11,'center');if(G.tick%60<38)txt('ENTER: MENU',W/2,124,'#fff',8,'center')}
 }
 ctx.restore();
}
let last=performance.now(),acc=0;
function loop(ts){acc+=Math.min(ts-last,100);last=ts;while(acc>=1000/60){step();pressed={};acc-=1000/60}render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
